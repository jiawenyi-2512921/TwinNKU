name: twinnku
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-twinnku}
      POSTGRES_USER: ${DB_USER:-twinnku}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  migrate:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    image: twinnku-api:${APP_VERSION:-0.3.0}
    command: [sh, -c, 'alembic upgrade head && python -m app.seed']
    environment: &api-environment
      APP_ENV: production
      APP_VERSION: ${APP_VERSION:-0.3.0}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-twinnku}
      DB_USER: ${DB_USER:-twinnku}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["localhost","127.0.0.1","api"]}
      MAP_ENABLED: ${MAP_ENABLED:-true}
      MAP_ASSETS_DIR: /data/maps
      FLOORS_ENABLED: ${FLOORS_ENABLED:-true}
      FLOOR_ASSETS_DIR: /data/floors
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
  api:
    image: twinnku-api:${APP_VERSION:-0.3.0}
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment: *api-environment
    volumes:
      - map_assets:/data/maps:ro
      - floor_assets:/data/floors:ro
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  map-import:
    profiles: [tools]
    image: twinnku-api:${APP_VERSION:-0.3.0}
    entrypoint: [python, -m, app.modules.maps.import_bundle]
    environment: *api-environment
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    volumes:
      - map_assets:/data/maps
      - ./var/map-import:/incoming:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  floor-import:
    profiles: [tools]
    image: twinnku-api:${APP_VERSION:-0.3.0}
    entrypoint: [python, -m, app.modules.floors.import_bundle]
    environment: *api-environment
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    volumes:
      - floor_assets:/data/floors
      - ./var/floor-import:/incoming:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  web:
    image: twinnku-web:${APP_VERSION:-0.3.0}
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:8080"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, --quiet, --spider, "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    tmpfs: ["/tmp:mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  pgdata:
  map_assets:
  floor_assets:
