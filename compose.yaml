name: twinnku
services:
  db:
    build:
      context: .
      dockerfile: deploy/db.Dockerfile
    image: twinnku-db:${APP_VERSION:-0.4.0}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-twinnku}
      POSTGRES_USER: ${DB_USER:-twinnku}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a strong DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [database]
  migrate:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    image: twinnku-api:${APP_VERSION:-0.4.0}
    command: [sh, -c, 'alembic upgrade head && python -m app.database_roles']
    environment: &api-environment
      APP_ENV: production
      APP_VERSION: ${APP_VERSION:-0.4.0}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-twinnku}
      DB_USER: ${DB_USER:-twinnku}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_APP_USER: ${DB_APP_USER:-twinnku_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set a distinct DB_APP_PASSWORD}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["localhost","127.0.0.1","api"]}
      MAP_ENABLED: ${MAP_ENABLED:-true}
      MAP_ASSETS_DIR: /data/maps
      FLOORS_ENABLED: ${FLOORS_ENABLED:-true}
      VR_ENABLED: ${VR_ENABLED:-true}
      FLOOR_ASSETS_DIR: /data/floors
      UPLOAD_ACTOR_BUDGET_BYTES: ${UPLOAD_ACTOR_BUDGET_BYTES:-1073741824}
      UPLOAD_CAMPUS_BUDGET_BYTES: ${UPLOAD_CAMPUS_BUDGET_BYTES:-5368709120}
      UPLOAD_MAX_CONCURRENCY: ${UPLOAD_MAX_CONCURRENCY:-2}
      UPLOAD_PARSER_TIMEOUT_SECONDS: ${UPLOAD_PARSER_TIMEOUT_SECONDS:-20}
      UPLOAD_PARSER_MEMORY_BYTES: ${UPLOAD_PARSER_MEMORY_BYTES:-536870912}
      UPLOAD_PARSER_CPU_SECONDS: ${UPLOAD_PARSER_CPU_SECONDS:-15}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-false}
      ADMIN_PUBLIC_ORIGIN: ${ADMIN_PUBLIC_ORIGIN:-}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-8}
      ADMIN_MFA_ENFORCED: ${ADMIN_MFA_ENFORCED:-false}
      ADMIN_SESSION_IDLE_MINUTES: ${ADMIN_SESSION_IDLE_MINUTES:-30}
      PUBLIC_SITE_ORIGIN: ${PUBLIC_SITE_ORIGIN:-https://2512921.cn}
      NK_GENIOS_API_ENABLED: ${NK_GENIOS_API_ENABLED:-false}
      NK_GENIOS_API_KEY: ${NK_GENIOS_API_KEY:-}
      AGENT_ACCESS_CODE: ${AGENT_ACCESS_CODE:-}
      AGENT_PUBLIC_ENABLED: ${AGENT_PUBLIC_ENABLED:-false}
      AGENT_TRUSTED_PROXY_IPS: ${AGENT_TRUSTED_PROXY_IPS:-[]}
      AGENT_MODEL_REQUESTS_PER_DAY: ${AGENT_MODEL_REQUESTS_PER_DAY:-720}
      AGENT_VOICE_REQUESTS_PER_DAY: ${AGENT_VOICE_REQUESTS_PER_DAY:-1200}
      AGENT_SUPPLIER_REQUESTS_PER_DAY: ${AGENT_SUPPLIER_REQUESTS_PER_DAY:-1920}
      AGENT_SUPPLIER_CHARACTERS_PER_DAY: ${AGENT_SUPPLIER_CHARACTERS_PER_DAY:-360000}
      AGENT_SUPPLIER_IP_REQUESTS_PER_DAY: ${AGENT_SUPPLIER_IP_REQUESTS_PER_DAY:-1080}
      AGENT_SUPPLIER_SESSION_REQUESTS_PER_DAY: ${AGENT_SUPPLIER_SESSION_REQUESTS_PER_DAY:-450}
      AGENT_HTTP_REQUESTS_PER_HOUR: ${AGENT_HTTP_REQUESTS_PER_HOUR:-2400}
      AGENT_HTTP_REQUESTS_PER_DAY: ${AGENT_HTTP_REQUESTS_PER_DAY:-14400}
      NK_GENIOS_WEB_ENABLED: ${NK_GENIOS_WEB_ENABLED:-false}
      NK_GENIOS_WEB_APP_KEY: ${NK_GENIOS_WEB_APP_KEY:-}
      NK_GENIOS_WEB_CONTEXT_ENABLED: ${NK_GENIOS_WEB_CONTEXT_ENABLED:-false}
      NK_GENIOS_WEB_HIDE_SIDEBAR: ${NK_GENIOS_WEB_HIDE_SIDEBAR:-true}
      VOICE_ENABLED: ${VOICE_ENABLED:-false}
      VOICE_API_KEY: ${VOICE_API_KEY:-}
      VOICE_BASE_URL: ${VOICE_BASE_URL:-}
      VOICE_TIER: ${VOICE_TIER:-standard}
      VOICE_TIMEOUT_SECONDS: ${VOICE_TIMEOUT_SECONDS:-20}
      VOICE_MAX_CHARACTERS: ${VOICE_MAX_CHARACTERS:-300}
      VOICE_CACHE_TTL_SECONDS: ${VOICE_CACHE_TTL_SECONDS:-86400}
      VOICE_VISITOR_REQUESTS_PER_HOUR: ${VOICE_VISITOR_REQUESTS_PER_HOUR:-45}
      VOICE_TOTAL_REQUESTS_PER_HOUR: ${VOICE_TOTAL_REQUESTS_PER_HOUR:-200}
      VOICE_ALLOWED_AUDIO_HOSTS: ${VOICE_ALLOWED_AUDIO_HOSTS:-[]}
      VOICE_MAX_AUDIO_BYTES: ${VOICE_MAX_AUDIO_BYTES:-8388608}
      VOICE_CACHE_MAX_BYTES: ${VOICE_CACHE_MAX_BYTES:-67108864}
      FORWARDED_ALLOW_IPS: 172.30.251.3
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [database]
  api:
    image: twinnku-api:${APP_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment: &runtime-environment
      <<: *api-environment
      DB_USER: ${DB_APP_USER:-twinnku_app}
      DB_PASSWORD: ${DB_APP_PASSWORD:?Set a distinct DB_APP_PASSWORD}
      # Online workers never receive the owner password or role-management secret.
      DB_APP_PASSWORD: ""
    volumes:
      - map_assets:/data/maps:ro
      - floor_assets:/data/floors
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    networks:
      frontend:
        ipv4_address: 172.30.251.2
      database: {}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  map-import:
    profiles: [tools]
    image: twinnku-api:${APP_VERSION:-0.4.0}
    entrypoint: [python, -m, app.modules.maps.import_bundle]
    environment: *runtime-environment
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    volumes:
      - map_assets:/data/maps
      - floor_assets:/data/floors
      - ./var/map-import:/incoming:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [database]
  floor-import:
    profiles: [tools]
    image: twinnku-api:${APP_VERSION:-0.4.0}
    entrypoint: [python, -m, app.modules.floors.import_bundle]
    environment: *runtime-environment
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    volumes:
      - floor_assets:/data/floors
      - ./var/floor-import:/incoming:ro
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [database]
  web:
    image: twinnku-web:${APP_VERSION:-0.4.0}
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:8080"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, --quiet, --spider, "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
    read_only: true
    tmpfs: ["/tmp:mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    networks:
      frontend:
        ipv4_address: 172.30.251.3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  pgdata:
  map_assets:
  floor_assets:
networks:
  frontend:
    ipam:
      config: [{subnet: 172.30.251.0/28}]
  database:
    internal: true
    ipam:
      config: [{subnet: 172.30.252.0/28}]
