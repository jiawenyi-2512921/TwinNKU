worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Avoid logging query strings and user conversation text.
    log_format minimal '$request_method $status $request_time';
    access_log /dev/stdout minimal;
    sendfile on;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;
    # Only Vite content-hashed files are immutable. API authorization and cache
    # headers remain under API control; HTML must revalidate after a new release.
    map $uri $frontend_cache_control {
        default "";
        "~^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.[A-Za-z0-9]+$" "public, max-age=31536000, immutable";
        ~^/assets/ "no-cache";
        /index.html "no-cache";
    }
    client_max_body_size 1m;
    # Only the host HTTPS proxy, entering via this bridge gateway, may replace
    # the peer address. API trusts only this web container (172.30.251.3).
    set_real_ip_from 172.30.251.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    map "$realip_remote_addr:$http_x_forwarded_proto" $forwarded_scheme {
        default $scheme;
        "172.30.251.1:https" https;
        "172.30.251.1:http" http;
    }
    limit_req_zone $binary_remote_addr zone=agent_requests:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=staff_login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=asset_uploads:10m rate=6r/m;
    limit_conn_zone $binary_remote_addr zone=client_connections:10m;
    limit_req_status 429;
    limit_conn_status 429;
    # The runtime user can write only to /tmp; image-owned cache paths stay read-only.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=(), publickey-credentials-get=(self), publickey-credentials-create=(self)" always;
        # Keep this at server scope: adding headers in child locations would
        # otherwise stop inheritance of the security headers below and above.
        add_header Cache-Control $frontend_cache_control;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        # A same-origin sandbox is not a security boundary for third-party JS.
        location = /agent/embed.html {
            return 410;
        }
        # Original floor images only; JSON endpoints retain the 1 MiB limit.
        location ~ ^/api/v1/admin/points/[0-9a-f-]+/experience-media$ {
            client_max_body_size 104m;
            limit_req zone=asset_uploads burst=2 nodelay;
            limit_conn client_connections 2;
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host "";
            proxy_request_buffering off;
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
        }
        location ~ ^/api/v1/admin/points/[0-9a-f-]+/floor-images$ {
            client_max_body_size 32m;
            limit_req zone=asset_uploads burst=2 nodelay;
            limit_conn client_connections 2;
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host "";
            proxy_request_buffering off;
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
        }
        location ~ ^/api/v1/(agent/(chat|guest|login|actions/resolve)|voice/(prepare|speech)|admin/voice/(prepare|speech))$ {
            limit_req zone=agent_requests burst=10 nodelay;
            limit_conn client_connections 8;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host "";
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
        }
        location = /api/v1/admin/auth/login {
            limit_req zone=staff_login burst=5 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host "";
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
        location ~ ^/(api/|health/|openapi\.json$|docs$|redoc$) {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host "";
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
        }
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
