worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Avoid logging query strings and user conversation text.
    log_format minimal '$request_method $status $request_time';
    access_log /dev/stdout minimal;
    sendfile on;
    server_tokens off;
    client_max_body_size 1m;
    # The runtime user can write only to /tmp; image-owned cache paths stay read-only.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        # The vendor SDK runs in its own document; keep the main/admin CSP unchanged.
        # Do not use wildcard hosts, unsafe-eval, or inline script exceptions.
        location = /agent/embed.html {
            try_files $uri =404;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Cache-Control "no-store" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://coze.nankai.edu.cn; style-src 'self' 'unsafe-inline' https://coze.nankai.edu.cn; img-src 'self' data: blob: https://coze.nankai.edu.cn; font-src 'self' https://coze.nankai.edu.cn; connect-src 'self' https://coze.nankai.edu.cn wss://coze.nankai.edu.cn; worker-src 'self' blob: https://coze.nankai.edu.cn; frame-src https://coze.nankai.edu.cn; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action https://coze.nankai.edu.cn" always;
        }
        # Original floor images only; JSON endpoints retain the 1 MiB limit.
        location ~ ^/api/v1/admin/points/[0-9a-f-]+/floor-images$ {
            client_max_body_size 32m;
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
        }
        location ~ ^/(api/|health/|openapi\.json$|docs$|redoc$) {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
        }
        location /assets/ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
